baseURL: "https://mczielinski.github.io/"
title: Mark Zielinski's Personal Website
pagination:
  pagerSize: 15
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: G-ML3ME5MBNB

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Mark Zielinski's Personal Website
  description: "Mark Zielinski's Personal Website"
  keywords: [Blog, Portfolio, PaperMod]
  author: Mark Zielinski
  images: ["/profile.jpg"]
  DateFormat: "2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    # To add a favicon, drop the files in static/ and reference them here, e.g.:
    # favicon: "/favicon.ico"
    # favicon16x16: "/favicon-16x16.png"
    # favicon32x32: "/favicon-32x32.png"
    # apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "Home"

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Mark C Zielinski, PhD
    subtitle: "Neuroscience Ph.D. and Senior AI Engineer at Prompt Health, where I build machine learning and AI systems for healthcare revenue cycle management (RCM) — predicting claim denials and powering automated, AI-enabled RCM workflows. My research roots are in teasing apart patterns of neural communication from the dynamics of brain activity, using extracellular multi-site electrophysiology, clinical-trial EEG, and modeling and simulation. I'm drawn to machine learning for messy time series at scale, and to graph-theoretic, information-theoretic, and Bayesian methods that turn bioinformatic and real-world data into clinical utility."
    imageUrl: "/profile.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Download Resume
        url: "/mcz_june_2026.pdf"
      - name: Download CV
        url: "/cv202307.pdf"
        
  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my website

  socialIcons:
    - name: github
      url: "https://github.com/mczielinski/"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=Ske6oe0AAAAJ&hl=en"
    - name: kaggle
      url: "https://www.kaggle.com/mczielinski"
    - name: linkedin
      url: "https://www.linkedin.com/in/mczie/"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/mczielinski/mczielinski.github.io/tree/master/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: resume
      name: resume
      url: "/mcz_june_2026.pdf"
      weight: 10
      
    - identifier: cv
      name: cv
      url: "/cv202307.pdf"
      weight: 20
      
    - identifier: publications
      name: publications
      url: /publications/
      weight: 30
      
    - identifier: projects
      name: projects
      url: /projects/
      weight: 40

    - identifier: posts
      name: posts
      url: /posts/
      weight: 50
      



# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
